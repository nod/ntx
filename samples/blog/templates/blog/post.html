{{template "base.html" .}}

{{define "title"}}{{.Post.Title}} — {{.SiteName}}{{end}}

{{define "content"}}
<article>
  <header class="post-header">
    <h1>{{.Post.Title}}</h1>
    <div class="post-meta">
      <time>{{.Post.CreatedAt.Format "2 January 2006"}}</time>
      {{if .Post.Tags}}
        {{range .Post.Tags}}<a href="/blog?tag={{.}}" class="tag">{{.}}</a>{{end}}
      {{end}}
    </div>
  </header>
  <div class="post-body">
    {{.Rendered}}
  </div>
  <footer class="post-back">
    <a href="/blog">&larr; all writing</a>
  </footer>
</article>
{{end}}
