<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}{{.SiteName}}{{end}}</title>
  <link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">
        <img src="/static/assets/logo.svg" alt="" class="logo-mark" width="57" height="38">
        <span class="logo-wordmark">{{.SiteName}}</span>
      </a>
      <ul>
        <li><a href="/blog">blog</a></li>
        <li><a href="/projects">projects</a></li>
        <li><a href="/about">about</a></li>
      </ul>
    </nav>
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
  <footer>
    <p>&copy; {{.SiteURL}}</p>
  </footer>
  {{block "scripts" .}}{{end}}
</body>
</html>
