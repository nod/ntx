{{template "base.html" .}}

{{define "title"}}{{if .Post}}edit post{{else}}new post{{end}} — admin — {{.SiteName}}{{end}}

{{define "content"}}
<section class="admin-editor">
  <div class="admin-header">
    <h1>{{if .Post}}edit post{{else}}new post{{end}}</h1>
    <a href="/admin/posts" class="btn btn-secondary">&larr; back</a>
  </div>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form method="POST" action="{{if .Post}}/admin/posts/{{.Post.ID}}{{else}}/admin/posts{{end}}">
    <div class="field">
      <label for="title">title</label>
      <input type="text" id="title" name="title" value="{{if .Post}}{{.Post.Title}}{{end}}" required>
    </div>

    <div class="field">
      <label for="slug">slug</label>
      <input type="text" id="slug" name="slug" value="{{if .Post}}{{.Post.Slug}}{{end}}" required>
    </div>

    <div class="field">
      <label for="tags">tags (comma-separated)</label>
      <input type="text" id="tags" name="tags" value="{{if .Post}}{{join .Post.Tags ", "}}{{end}}">
    </div>

    <div class="field">
      <label for="body">body (markdown)</label>
      <textarea id="body" name="body" rows="24">{{if .Post}}{{.Post.Body}}{{end}}</textarea>
    </div>

    <div class="actions">
      <button type="submit" name="action" value="draft">save draft</button>
      <button type="submit" name="action" value="publish" class="btn-primary">publish</button>
      {{if .Post}}
      <button type="submit" name="action" value="delete" class="btn-danger" onclick="return confirm('Delete this post?')">delete</button>
      {{end}}
    </div>
  </form>
</section>
{{end}}

{{define "scripts"}}
<script>
  const titleInput = document.getElementById('title');
  const slugInput = document.getElementById('slug');
  const slugEdited = slugInput.value !== '';

  titleInput.addEventListener('input', () => {
    if (slugEdited) return;
    slugInput.value = titleInput.value
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  });

  slugInput.addEventListener('input', () => {});
</script>
{{end}}
