{{template "base.html" .}}

{{define "title"}}{{.Post.Title}} — {{.SiteName}}{{end}}

{{define "content"}}
<article class="blog-post">
  <header>
    <h1>{{.Post.Title}}</h1>
    <div class="meta">
      <time>{{.Post.CreatedAt.Format "2006-01-02"}}</time>
      {{if .Post.Tags}}
      <span class="tags">
        {{range .Post.Tags}}<a href="/blog?tag={{.}}" class="tag">{{.}}</a>{{end}}
      </span>
      {{end}}
    </div>
  </header>
  <div class="post-body">
    {{.Rendered}}
  </div>
  <footer>
    <a href="/blog">&larr; back to blog</a>
  </footer>
</article>
{{end}}
