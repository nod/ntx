# ntx.sample.toml — copy to ntx.toml and fill in the required fields
#
# Quickest setup:
#   ntx gen-config -p > ntx.toml   (prompts for password, auto-generates session_secret)
#
# Manual alternative:
#   admin_password_hash  →  ntx hash-password
#   session_secret       →  auto-generated by ntx gen-config (no manual step needed)
#
# Everything before the first [[site]] block is process-global. Everything
# inside a [[site]] block belongs to one website; one ntx process can serve
# several.

# Server
bind_addr = ""      # empty = localhost only; "0.0.0.0" to listen on all interfaces
port      = 8080
dev       = false   # true: templates re-read from disk on every request (no restart needed)

# Paths (relative to working directory). These are shared defaults — a [[site]]
# can override template_path or static_path with its own.
static_path   = "./static"
template_path = "./templates"
db_dsn        = "sqlite://./ntx.db"

# Auth — required, no default
session_secret = ""   # random string, min 32 chars; auto-generated by ntx gen-config

# Optional: one bcrypt hash that can log into every site's admin, alongside
# each site's own admin_password_hash. Leave it commented out unless you want
# an all-sites admin credential.
# global_admin_password_hash = ""

# One [[site]] block per website. Requests are routed to a site by matching the
# HTTP Host header against its site_url, so site_url must be the hostname you
# actually browse with — "localhost" for local testing, your real domain in
# production. A request whose Host matches no site gets a 404.

[[site]]
key                 = "mysite"             # stable id: owns this site's posts/tags and names its `ntx generate` output dir
site_url            = "localhost"          # routing key: the Host header this site answers on
site_name           = "mysite"             # default: "ntx"
site_description    = "My personal site."
about_slug          = "about"              # /about redirects to /blog/<about_slug>
admin_password_hash = ""                   # bcrypt hash; run: ntx gen-config -p  or  ntx hash-password

# Content sections
# Each [[site.section]] registers routes on its site: /{slug}/{page-slug}
# Templates live at: {template_path}/sections/{slug}/{page-slug}/index.html
#
# Extra keys on [[site.section]] or on a page entry are passed to the template
# as top-level variables (page keys override section keys on conflict).

  [[site.section]]
  slug  = "projects"
  title = "Projects"
  pages = [
    { slug = "one", title = "Project One" },
    { slug = "two", title = "Project Two" },
  ]

#   [[site.section]]
#   slug  = "writing"
#   title = "Writing"
#   pages = [
#     { slug = "essay-one", title = "Some Essay", year = "2024" },
#   ]

# A second website served by the same process. It gets its own posts, tags and
# admin password, and may point at its own templates and static files.
#
# [[site]]
# key                 = "othersite"
# site_url            = "other.example.com"
# site_name           = "Other Site"
# admin_password_hash = ""
# template_path       = "./other-templates"   # optional per-site override
# static_path         = "./other-static"      # optional per-site override
