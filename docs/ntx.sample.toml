# ntx.sample.toml — copy to ntx.toml and fill in the required fields
#
# Quickest setup:
#   ntx gen-config -p > ntx.toml   (prompts for the root password, generates the secrets)
#
# Manual alternative:
#   root_password_hash  →  ntx hash-password
#   session_secret      →  any random string of 32+ characters
#   encryption_key      →  openssl rand -base64 32
#
# This file holds only server settings. Sites, their sections and their posts
# live in the database: sign in as "root" on platform_hostname and create them
# under "sites".

bind_addr          = ""            # empty = localhost only; "0.0.0.0" listens on all interfaces
port               = 8080
db_dsn             = "sqlite://./ntx.db"   # or postgres://user:pass@host/db
dev                = false         # true: re-read templates on every request; cookies without Secure

# Requests from these addresses may set X-Forwarded-For / X-Forwarded-Proto.
# Keep this to your reverse proxy; the default suits a proxy on this machine.
trusted_proxies    = ["127.0.0.1/32", "::1/128"]

session_secret     = ""            # required: random, min 32 chars
encryption_key     = ""            # required: 32 random bytes, base64

themes_path        = "./themes"    # one folder per theme: <name>/templates, <name>/static
platform_hostname  = "localhost"   # where root signs in before any site exists; no site may use it
root_password_hash = ""            # required: bcrypt hash (ntx hash-password)
