{{define "title"}}sites{{end}}
{{define "content"}}
<section>
  <div class="row">
    <h1>sites</h1>
    <a href="/admin/platform/sites/new" class="button primary">new site</a>
  </div>
  <table>
    <thead><tr><th>key</th><th>hostname</th><th>name</th><th>theme</th></tr></thead>
    <tbody>
    {{range .Sites}}
      <tr><td><a href="/admin/platform/sites/{{.Key}}">{{.Key}}</a></td><td>{{.Hostname}}</td><td>{{.Name}}</td><td>{{.Theme}}</td></tr>
    {{else}}
      <tr><td colspan="4" class="muted">no sites yet</td></tr>
    {{end}}
    </tbody>
  </table>
  {{if not .Themes}}<p class="hint">No themes found in the themes folder: a site needs one.</p>{{end}}
</section>
{{end}}
