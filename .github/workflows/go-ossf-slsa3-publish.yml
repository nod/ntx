name: SLSA Go releaser

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  args:
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.ldflags.outputs.version }}
      commit:      ${{ steps.ldflags.outputs.commit }}
      commit-date: ${{ steps.ldflags.outputs.commit-date }}
      tree-state:  ${{ steps.ldflags.outputs.tree-state }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - id: ldflags
        run: |
          echo "version=$(git describe --tags --always --dirty | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA"                                              >> "$GITHUB_OUTPUT"
          echo "commit-date=$(git log -1 --pretty=%ct)"                         >> "$GITHUB_OUTPUT"
          echo "tree-state=$(git diff --quiet && echo clean || echo dirty)"     >> "$GITHUB_OUTPUT"

  build:
    needs: args
    permissions:
      id-token: write   # for signing provenance
      contents: write   # for uploading release assets
      actions: read     # for reading workflow state
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.0.0
    with:
      go-version-file: go.mod
      config-file: .slsa-goreleaser.yml
      evaluated-envs: >-
        VERSION:${{ needs.args.outputs.version }},
        COMMIT:${{ needs.args.outputs.commit }},
        COMMIT_DATE:${{ needs.args.outputs.commit-date }},
        TREE_STATE:${{ needs.args.outputs.tree-state }}
