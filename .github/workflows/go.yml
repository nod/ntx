name: Go

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

  # On a v* tag: build linux/darwin x amd64/arm64, publish them with a
  # checksums.txt as a GitHub release. Names (ntx-<os>-<arch>) are what
  # install.sh and Formula/ntx.rb download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod

      - name: Build all platforms
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="build/ntx-${os}-${arch}"
              echo "building ${out}..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-X main.version=${version}" \
                -o "$out" .
            done
          done
          (cd build && sha256sum ntx-* > checksums.txt)
          cat build/checksums.txt

      - name: Check the binary reports the tag's version
        run: |
          got="$(build/ntx-linux-amd64 version)"
          want="${GITHUB_REF_NAME#v}"
          [ "$got" = "$want" ] || { echo "ntx version printed '$got', expected '$want'"; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ntx-*
            build/checksums.txt
          generate_release_notes: true
          # v1.2.3-rc1 and the like are pre-releases: not "latest", and the
          # formula job below skips them.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: checksums
          path: build/checksums.txt

  # Point Formula/ntx.rb at the new release and commit it to main, so
  # `brew install` picks it up. Skipped for pre-releases.
  formula:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: main

      - uses: actions/download-artifact@v4.3.0
        with:
          name: checksums
          path: build

      - name: Regenerate Formula/ntx.rb
        run: scripts/gen-formula.sh "${GITHUB_REF_NAME#v}" build/checksums.txt > Formula/ntx.rb

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ntx.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "Update Homebrew formula to ${GITHUB_REF_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main
